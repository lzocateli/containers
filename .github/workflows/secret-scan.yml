name: Secret scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Gitleaks no historico
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_IMAGE: zricethezav/gitleaks:v8.30.1
    steps:
      - name: Obter historico completo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Examinar historico Git
        run: bash tools/scripts/secret-scan.sh --history

      - name: Publicar log redigido
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: secret-scan-${{ github.run_id }}
          path: .tmp/secret-scan.sh-*.log
          if-no-files-found: ignore
          retention-days: 14
          include-hidden-files: true

      - name: Publicar relatório redigido
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: secret-scan-report-${{ github.run_id }}
          path: .tmp/secret-scan.sh-*.json
          if-no-files-found: ignore
          retention-days: 14
