name: Validar imagens de container

on:
  pull_request:
    branches:
      - main
    paths:
      - "**/Dockerfile*"
      - "**/.dockerignore"
      - "**/.gitignore"
      - "**/README.md"
      - "**/readme.md"
      - "**/*.sh"
      - "**/*.conf"
      - "**/*.toml"
      - "tools/container-images.json"
      - ".github/dependabot.yml"
      - "tools/**"
      - ".github/workflows/**"
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

env:
  AUTHORIZED_WORKFLOW_DISPATCH_ACTOR: ${{ vars.AUTHORIZED_WORKFLOW_DISPATCH_ACTOR || 'lzocateli' }}

concurrency:
  group: validate-images-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  catalog:
    name: Catálogo e descoberta
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}
    steps:
      - name: Validar ator autorizado para disparo manual
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          ACTOR: ${{ github.actor }}
          AUTHORIZED: ${{ env.AUTHORIZED_WORKFLOW_DISPATCH_ACTOR }}
        run: |
          set -euo pipefail
          if [[ "$ACTOR" != "$AUTHORIZED" ]]; then
            echo "Apenas $AUTHORIZED pode disparar este workflow manualmente (actor atual: $ACTOR)." >&2
            exit 1
          fi

      - name: Obter repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configurar uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.26"
          enable-cache: false

      - name: Validar catálogo
        run: uv run --project tools --frozen python tools/scripts/container-catalog/main.py validate

      - name: Descobrir imagens alteradas
        id: matrix
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_BASE_SHA: ${{ github.event.merge_group.base_sha }}
          MERGE_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail

          case "$EVENT_NAME" in
            pull_request)
              base="$PR_BASE_SHA"
              head="$PR_HEAD_SHA"
              ;;
            merge_group)
              base="$MERGE_BASE_SHA"
              head="$MERGE_HEAD_SHA"
              ;;
            workflow_dispatch)
              base="HEAD^"
              head="HEAD"
              ;;
            *)
              echo "Evento não suportado: $EVENT_NAME" >&2
              exit 1
              ;;
          esac

          matrix="$(uv run --project tools --frozen python tools/scripts/container-catalog/main.py matrix --base "$base" --head "$head")"
          count="$(jq '.include | length' <<<"$matrix")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Imagens alteradas: $count"

  repository-security:
    name: Secrets e configurações
    runs-on: ubuntu-24.04
    steps:
      - name: Validar ator autorizado para disparo manual
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          ACTOR: ${{ github.actor }}
          AUTHORIZED: ${{ env.AUTHORIZED_WORKFLOW_DISPATCH_ACTOR }}
        run: |
          set -euo pipefail
          if [[ "$ACTOR" != "$AUTHORIZED" ]]; then
            echo "Apenas $AUTHORIZED pode disparar este workflow manualmente (actor atual: $ACTOR)." >&2
            exit 1
          fi

      - name: Obter repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Bloquear secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: sarif
          output: trivy-secrets.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Relatar misconfigurações
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: misconfig
          format: sarif
          output: trivy-misconfigurations.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Publicar relatório do repositório
        if: always() && (hashFiles('trivy-secrets.sarif') != '' || hashFiles('trivy-misconfigurations.sarif') != '')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-repository-${{ github.run_id }}
          path: |
            trivy-secrets.sarif
            trivy-misconfigurations.sarif
          retention-days: 14

  dependency-review:
    name: Revisar dependências
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Revisar mudanças de dependências
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: critical
          comment-summary-in-pr: never

  image:
    name: Imagem ${{ matrix.image.id }}
    if: needs.catalog.outputs.count != '0'
    needs: catalog
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.catalog.outputs.matrix).include }}
    steps:
      - name: Obter repositório
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validar contrato do diretório
        shell: bash
        env:
          CONTEXT_PATH: ${{ matrix.image.context }}
          DOCKERFILE_NAME: ${{ matrix.image.dockerfile }}
        run: |
          set -euo pipefail

          test -f "$CONTEXT_PATH/$DOCKERFILE_NAME"
          test -f "$CONTEXT_PATH/.gitignore"
          test -f "$CONTEXT_PATH/.dockerignore"
          test -f "$CONTEXT_PATH/README.md"
          test "$(wc -c < "$CONTEXT_PATH/README.md")" -le 25000
          grep -Eq '^[[:space:]]*\.env([*./]|$)' "$CONTEXT_PATH/.gitignore"
          grep -Eq '^[[:space:]]*\.env([*./]|$)' "$CONTEXT_PATH/.dockerignore"
          grep -Eq '^[[:space:]]*\.git([*./]|$)' "$CONTEXT_PATH/.dockerignore"
          git check-ignore --no-index --quiet "$CONTEXT_PATH/.env"
          if grep -Eq '^[[:space:]]*!\.env([*./]|$)' "$CONTEXT_PATH/.dockerignore"; then
            echo ".dockerignore não pode reintroduzir .env" >&2
            exit 1
          fi
          if grep -Eq '^[[:space:]]*!\.git([*./]|$)' "$CONTEXT_PATH/.dockerignore"; then
            echo ".dockerignore não pode reintroduzir .git" >&2
            exit 1
          fi

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Validar Dockerfile com BuildKit
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.context }}/${{ matrix.image.dockerfile }}
          call: check

      - name: Construir imagem para análise
        if: matrix.image.validation == 'build'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.context }}/${{ matrix.image.dockerfile }}
          platforms: ${{ matrix.image.scanPlatform }}
          load: true
          tags: local/${{ matrix.image.id }}:${{ github.sha }}
          cache-from: type=gha,scope=pr-${{ matrix.image.id }}
          cache-to: type=gha,mode=max,scope=pr-${{ matrix.image.id }}

      - name: Executar smoke test catalogado
        if: matrix.image.validation == 'build' && matrix.image.smokeTest != ''
        shell: bash
        env:
          CONTEXT_PATH: ${{ matrix.image.context }}
          SMOKE_TEST: ${{ matrix.image.smokeTest }}
          IMAGE_REF: local/${{ matrix.image.id }}:${{ github.sha }}
        run: |
          set -euo pipefail
          bash "$CONTEXT_PATH/$SMOKE_TEST" --image "$IMAGE_REF"

      - name: Gerar relatório de vulnerabilidades
        if: matrix.image.validation == 'build'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/${{ matrix.image.id }}:${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.image.id }}.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Bloquear vulnerabilidades críticas corrigíveis
        if: matrix.image.validation == 'build'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/${{ matrix.image.id }}:${{ github.sha }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Publicar relatório como artifact
        if: always() && matrix.image.validation == 'build' && hashFiles(format('trivy-{0}.sarif', matrix.image.id)) != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-${{ matrix.image.id }}-${{ github.run_id }}
          path: trivy-${{ matrix.image.id }}.sarif
          retention-days: 30

      - name: Enviar resultado ao Code Scanning
        if: always() && matrix.image.validation == 'build' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && hashFiles(format('trivy-{0}.sarif', matrix.image.id)) != ''
        uses: github/codeql-action/upload-sarif@4187e74d05793876e9989daffde9c3e66b4acd07 # v3.37.3
        with:
          sarif_file: trivy-${{ matrix.image.id }}.sarif
          category: trivy-${{ matrix.image.id }}