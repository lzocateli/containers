services:
  db:
    image: lzocateli/oracle:23-slim
    container_name: oracle
    restart: unless-stopped
    environment:
      - ORACLE_PASSWORD=${ORACLE_PASSWORD}
      # Nao defina FREEPDB1 aqui: ele ja existe na imagem base.
      - ORACLE_DATABASE=${ORACLE_DATABASE:-}
      - ORACLE_USER=${ORACLE_USER:-app}
      - ORACLE_USER_PASSWORD=${ORACLE_USER_PASSWORD}
      - ORACLE_TABLESPACE=${ORACLE_TABLESPACE:-USERS}
    ports:
      - "127.0.0.1:1521:1521"
    networks:
      - lzo
    volumes:
      - ${DATA_DIR:-./data}/oracle:/opt/oracle/oradata
      - ./scripts:/container-entrypoint-initdb.d:ro
    healthcheck:
      # O script healthcheck.sh ja existe na imagem base gvenzl/oracle-free.
      test: ["CMD", "healthcheck.sh"]
      start_period: 120s
      interval: 60s
      timeout: 10s
      retries: 3

networks:
  lzo:
    name: lzo
    driver: bridge
