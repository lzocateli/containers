version: "3.8"


services:

  cloudflared:
    container_name: cloudflared
    image: cloudflare/cloudflared:2024.8.3-amd64
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TUNNEL_TOKEN:?defina CLOUDFLARED_TUNNEL_TOKEN}
    environment:
      - TZ=America/Sao_Paulo
      - TUNNEL_TOKEN=${CLOUDFLARED_TUNNEL_TOKEN:?defina CLOUDFLARED_TUNNEL_TOKEN}
    volumes:
      - /userapps/vol-pihole/etc/cloudflared:/etc/cloudflared
    networks:
      dns_net:
        ipv4_address: 172.16.10.53


  pihole:
    container_name: pihole
    image: lzocateli/pihole:2024.07.0
    restart: unless-stopped
    hostname: pi.hole
    depends_on:
      - cloudflared
 #     - unbound
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      # - "67:67/udp"
      - "80:80/tcp"
      # - "443:443/tcp"
    environment:
      TZ: 'America/Sao_Paulo'
      WEBPASSWORD_FILE: #'/run/secrets/pihole'
#      PIHOLE_DNS_: '172.16.10.53#5053'
      PIHOLE_DNS_: '172.16.10.53'
      DNSMASQ_LISTENING: 'all'
      VIRTUAL_HOST: 'pi.hole'
      PROXY_LOCATION: 'pi.hole'
      FTLCONF_LOCAL_IPV4: '127.0.0.1'
      FTLCONF_LOCAL_IPV6: 'fd28:fd43:c2c2::f78'
    volumes:
      - /userapps/vol-pihole/etc/pihole/99-edns.conf:/etc/pihole/99-edns.conf
      - /userapps/vol-pihole/etc/pihole:/etc/pihole
      - /userapps/vol-pihole/etc/dnsmasq.d:/etc/dnsmasq.d
    cap_add:
      - NET_ADMIN
#    secrets:
#      - source: pihole
#        target: /run/secrets/pihole
    networks:
      dns_net:
        ipv4_address: 172.16.10.51


#  unbound:
#    container_name: unbound
#    image: lzocateli/unbound:1.20.0
#    restart: unless-stopped
#    ports:
#      - "5053:53/tcp"
#      - "5053:53/udp"
#    environment:
#      TZ: 'America/Sao_Paulo'
#    volumes:
#      - /userapps/vol-pihole/etc/unbound:/opt/unbound/etc/unbound
#      - /userapps/var/log/unbound/unbound.log:/var/log/unbound/unbound.log
#    networks:
