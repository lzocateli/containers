version: "3.8"


services:

  cloudflared:
    container_name: cloudflared
    image: lzocateli/cloudflared:2024.8.2-amd64
    restart: unless-stopped
    command: proxy-dns
    environment:
      TZ: 'America/Sao_Paulo'
      TUNNEL_DNS_UPSTREAM: 'https://1.1.1.1/dns-query,https://1.0.0.1/dns-query,https://9.9.9.9/dns-query,https://149.112.112.9/dns-query'
      TUNNEL_DNS_PORT: '5053'
      TUNNEL_DNS_ADDRESS: '0.0.0.0'
    networks:
      dns_net:
        ipv4_address: 172.16.10.53
#        ipv4_address: 172.16.53.4


  pihole:
    container_name: pihole
    image: lzocateli/pihole:2024.07.0
    restart: unless-stopped
    hostname: pihole.lzoca
    depends_on:
      - cloudflared
 #     - unbound
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      # - "67:67/udp"
      - "80:80/tcp"
      # - "443:443/tcp"
    environment:
      TZ: 'America/Sao_Paulo'
      WEBPASSWORD_FILE: 'password'  #'/run/secrets/pihole'
      PIHOLE_DNS_: '172.16.10.53#5053'
      DNSMASQ_LISTENING: 'all'
      VIRTUAL_HOST: pihole.lzoca.local
    volumes:
      - /userapps/vol-pihole/etc/pihole/99-edns.conf:/etc/pihole/99-edns.conf
      - /userapps/vol-pihole/etc/pihole:/etc/pihole
      - /userapps/vol-pihole/etc/dnsmasq.d:/etc/dnsmasq.d
    cap_add:
      - NET_ADMIN
#    secrets:
#      - source: pihole
#        target: /run/secrets/pihole
    networks:
      dns_net:
        ipv4_address: 172.16.10.51
#        ipv4_address: 172.16.53.2


#  unbound:
#    container_name: unbound
#    image: lzocateli/unbound:1.20.0
#    restart: unless-stopped
#    ports:
#      - "5053:53/tcp"
#      - "5053:53/udp"
