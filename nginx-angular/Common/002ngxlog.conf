log_format  main  escape=json '{'
    ' "time": "$time_local",'
    ' "status": "$status",'                
    ' "http_x_real_ip": "$http_x_real_ip",'
    ' "realip_remote_addr": "$http_cf_connecting_ip",'
    ' "proxy_add_x_forwarded_for": "$proxy_add_x_forwarded_for",'
    ' "http_x_forwarded_for": "$http_x_forwarded_for",'        
    ' "remote_addr": "$remote_addr",'        
    ' "remote_user": "$remote_user",'
    ' "host": "$host",'
    ' "http_name":"$http_name",'
    ' "cookie_name":"$cookie_name",'
    ' "query_string":"$query_string",'
    ' "tcpinfo_rtt":"$tcpinfo_rtt",'
    ' "http_x_my_location":"$http_x_my_location",'

    ' "bytes_sent": $bytes_sent,'
    ' "body_bytes_sent": $body_bytes_sent,'
    ' "request_length": $request_length,'

    ' "http_x_assets_host": "$http_x_assets_host",'

    # ' "request_body": "$request_body",'

    ' "request_time": $request_time,'
    ' "request": "$request", '        
    ' "http_header":"$http_header",'
    ' "http_referer": "$http_referer",'
    ' "http_user_agent": "$http_user_agent",'
    ' "server_name": "$server_name",'
    ' "http_range":"$http_range",'
    ' "connection":"$connection",'
    ' "connection_requests":"$connection_requests",'
    ' "upstream_addr":          "$upstream_addr",'
    ' "upstream_status":        "$upstream_status",'
    ' "upstream_header_time":   "$upstream_header_time",'
    ' "upstream_cache_status":  "$upstream_cache_status",'
    ' "upstream_connect_time":  "$upstream_connect_time",'
    ' "upstream_cookie_name":   "$upstream_cookie_name",'
    ' "upstream_response_time": "$upstream_response_time",'
    ' "msec": $msec'
    ' } ';


access_log             /var/log/nginx/access.log main buffer=512k flush=1440m;
error_log              /var/log/nginx/error.log;
