<source>
  @type tail
  path /var/log/nginx/access.log
  pos_file /var/opt/microsoft/omsagent/${WORKSPACE_ID}/state/nginx-access.pos
  tag nginx.access
  format json
</source>

<source>
  @type tail
  path /var/log/nginx/error.log
  pos_file /var/opt/microsoft/omsagent/${WORKSPACE_ID}/state/nginx-error.pos
  tag nginx.error
  format json
</source>
