services:
  listmonk:
    image: lzocateli/listmonk:v6.0.0
    container_name: blog-listmonk
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      TZ: America/Sao_Paulo
    command: ["sh", "-c", "./listmonk --install --idempotent --yes --config '' && ./listmonk --config ''"]
    volumes:
      - ./config.toml:/listmonk/config.toml:ro
    depends_on:
      postgres:
        condition: service_healthy
