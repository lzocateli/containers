version: "3.7"

services:
  db:
    image: lzocateli/postgresql:17-bookworm
    container_name: postgresql
    environment:
      - POSTGRES_PASSWORD=Myadm@12390
      - PG_DATABASE=lzoca
      - PG_DATABASE_ENCODING=UTF8
      - PG_USER=myuser
      - PG_PASSWORD=Teste@1234
    ports:
      - 5432:5432
    networks:
      - lzo
    volumes:
      - /userapps/configs/db-scripts/:/docker-entrypoint-initdb.d/
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "myuser", "-d", "lzoca"]
      start_period: 60s
      interval: 60s
      timeout: 10s
      retries: 2

networks:
  lzo:
    name: lzo
    driver: bridge
