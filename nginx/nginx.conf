# Generated by nginxconfig.io
# https://www.digitalocean.com/community/tools/nginx?domains.0.server.domain=friday.nuuve.com.br&domains.0.https.http2=false&domains.0.https.certType=custom&domains.0.https.sslCertificate=%2Fetc%2Fnginx%2Fssl%2Ffriday.nuuve.com.br.crt&domains.0.https.sslCertificateKey=%2Fetc%2Fnginx%2Fssl%2Ffriday.nuuve.com.br.key&domains.0.php.php=false&domains.0.reverseProxy.reverseProxy=true&domains.0.reverseProxy.path=%2Fpenf&domains.0.reverseProxy.proxyPass=http%3A%2F%2FPenfApi%3A5000&domains.0.routing.root=false&domains.0.routing.index=index.html&domains.0.routing.fallbackHtml=true&domains.0.logging.accessLog=true&domains.0.logging.errorLog=true&global.https.ocspGoogle=false&global.nginx.user=nginx&global.nginx.pid=%2Fvar%2Frun%2Fnginx.pid&global.docker.dockerfile=true&global.docker.dockerCompose=true&global.tools.modularizedStructure=false&global.app.lang=ptBR

#user                nginx;
pid                  /var/run/nginx.pid;
worker_processes     auto;
worker_rlimit_nofile 1024;


include              /etc/nginx/modules-enabled/*.conf;

events {
    multi_accept       on;
    worker_connections 1024;
}



http {
    charset                         utf-8;
    sendfile                        on;
    tcp_nopush                      on;
    tcp_nodelay                     on;
    server_tokens                   off;
    log_not_found                   off;
    types_hash_max_size             4096;
    types_hash_bucket_size          256;
    server_names_hash_bucket_size   128;
    server_names_hash_max_size      512;
    map_hash_max_size               4096;
    map_hash_bucket_size            256;
    client_max_body_size            16M;
    variables_hash_max_size         4096;
    variables_hash_bucket_size      256;


    # MIME
    include                mime.types;
    default_type           application/octet-stream;


    more_set_headers 'Server: luna';

    # ssl_session_tickets off;
    # ssl_protocols          TLSv1.2 TLSv1.3;
    # ssl_ciphers            ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    # ssl_prefer_server_ciphers off;



    # Cria variáveis relacionadas ao ISP
    #
    geoip2 /usr/share/GeoIP/GeoLite2-ASN.mmdb {
        auto_reload 60m;
        $geoip2_data_asn_ip                  network;
        $geoip2_data_asn_system_number       autonomous_system_number;
        $geoip2_data_asn_system_organization autonomous_system_organization;
    }

    # Cria variáveis relacionadas ao país de acesso
    #
    geoip2 /usr/share/GeoIP/GeoLite2-Country.mmdb {
        auto_reload 60m;
        $geoip2_data_continent_code    default="SA" continent code;
        $geoip2_data_country_name      country;
        $geoip2_data_country_code      country code;
        $geoip2_data_country_iso_code  country iso_code;
        $geoip2_metadata_country_build metadata build_epoch;
    }

    # Cria variáveis relacionadas à cidade de acesso
    #
    geoip2 /usr/share/GeoIP/GeoLite2-City.mmdb {
        auto_reload 60m;
        $geoip2_data_city_name   city names en;
        $geoip2_data_postal_code postal code;
        $geoip2_data_latitude    location latitude;
        $geoip2_data_longitude   location longitude;
        $geoip2_data_state_name  subdivisions 0 names en;
        $geoip2_data_state_code  subdivisions 0 iso_code;
    }


    # Bloqueio por codigo do pais conforme https://en.wikipedia.org/wiki/ISO_3166-1
    #
    map $geoip2_data_country_code $domain_zocate.li_allowed_country {
        default yes;

        RU no;
        CN no;
        IR no;
        KP no;
        VN no;

    }



    log_format  main  escape=json '{'
        ' "time":                   "$time_local",'
        ' "status":                 "$status",'                
        ' "http_x_real_ip":         "$http_x_real_ip",'
        ' "realip_remote_addr":     "$http_cf_connecting_ip",'
        ' "proxy_add_x_forwarded_for": "$proxy_add_x_forwarded_for",'
        ' "http_x_forwarded_for":   "$http_x_forwarded_for",'        
        ' "remote_addr":            "$remote_addr",'        
        ' "remote_user":            "$remote_user",'
        ' "host":                   "$host",'
        ' "http_name":              "$http_name",'
        ' "cookie_name":            "$cookie_name",'
        ' "query_string":           "$query_string",'
        ' "tcpinfo_rtt":            "$tcpinfo_rtt",'
        ' "bytes_sent":             $bytes_sent,'
        ' "body_bytes_sent":        $body_bytes_sent,'
        ' "request_length":         $request_length,'
        ' "http_x_assets_host":     "$http_x_assets_host",'
    #    ' "request_body":           "$request_body",'
        ' "request_time":           "$request_time",'
        ' "request":                "$request",'        
        ' "http_header":            "$http_header",'
        ' "http_referer":           "$http_referer",'
        ' "http_user_agent":        "$http_user_agent",'
        ' "server_name":            "$server_name",'
        ' "http_range":             "$http_range",'
        ' "connection":             "$connection",'
        ' "connection_requests":    "$connection_requests",'
        ' "upstream_addr":          "$upstream_addr",'
        ' "upstream_status":        "$upstream_status",'
        ' "upstream_header_time":   "$upstream_header_time",'
        ' "upstream_cache_status":  "$upstream_cache_status",'
        ' "upstream_connect_time":  "$upstream_connect_time",'
        ' "upstream_cookie_name":   "$upstream_cookie_name",'
        ' "upstream_response_time": "$upstream_response_time",'
        ' "msec":                   $msec,'
        ' "country_iso_code":       "$geoip2_data_country_iso_code",'
        ' "city_name":              "$geoip2_data_city_name",'
        ' "asn_ip":                 "$geoip2_data_asn_ip",'
        ' } ';

    
    access_log             /var/log/nginx/access.log main buffer=512k flush=1440m;
    error_log              /var/log/nginx/error.log;
    

    # Connection header for WebSocket reverse proxy
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    map $remote_addr $proxy_forwarded_elem {

        # IPv4 addresses can be sent as-is
        ~^[0-9.]+$        "for=$remote_addr";

        # IPv6 addresses need to be bracketed and quoted
        ~^[0-9A-Fa-f:.]+$ "for=\"[$remote_addr]\"";

        # Unix domain socket names cannot be represented in RFC 7239 syntax
        default           "for=unknown";
    }
    
    
    map $status $status_text {
        400 "Bad Request";
        401 "Unauthorized";
        402 "Payment Required";
        403 "Forbidden";
        404 "Not Found";
        405 "Method Not Allowed";
        406 "Not Acceptable";
        407 "Proxy Authentication Required";
        408 "Request Timeout";
        409 "Conflict";
        410 "Gone";
        411 "Length Required";
        412 "Precondition Failed";
        413 "Payload Too Large";
        414 "URI Too Long";
        415 "Unsupported Media Type";
        416 "Range Not Satisfiable";
        417 "Expectation Failed";
        418 "I am a teapot";
        421 "Misdirected Request";
        422 "Unprocessable Entity";
        423 "Locked";
        424 "Failed Dependency";
        425 "Too Early";
        426 "Upgrade Required";
        428 "Precondition Required";
        429 "Too Many Requests";
        431 "Request Header Fields Too Large";
        451 "Unavailable For Legal Reasons";
        494 "Request header too large";
        495 "SSL Certificate Error";
        496 "SSL Certificate Required";
        497 "HTTP Request Sent to HTTPS Port";
        500 "Internal Server Error";
        501 "Not Implemented";
        502 "Bad Gateway";
        503 "Service Unavailable";
        504 "Gateway Timeout";
        505 "HTTP Version Not Supported";
        506 "Variant Also Negotiates";
        507 "Insufficient Storage";
        508 "Loop Detected";
        510 "Not Extended";
        511 "Network Authentication Required";
        default "Something went wrong";
    }


                               
    gzip                  on;
    gzip_proxied         any;
    gzip_comp_level        6;
    gzip_min_length      256;
    gzip_vary             on;
    gzip_disable         “MSIE [1-6]\.(?!.*SV1)”;

      gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rss+xml
        application/vnd.geo+json
        application/vnd.ms-fontobject
        # application/x-font-ttf
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/opentype
        image/bmp
        image/svg+xml
        image/x-icon
        text/cache-manifest
        text/xml
        text/css
        text/plain
        text/vcard
        text/vnd.rim.location.xloc
        text/vtt
        text/x-component
        text/x-cross-domain-policy;


    include /etc/nginx/conf.d/*.conf;
    # include /etc/nginx/sites-enabled/*;

}