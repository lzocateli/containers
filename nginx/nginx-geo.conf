# GeoIP2 snippet para uso via bind mount em /etc/nginx/conf.d.
# Este arquivo deve conter apenas blocos de geolocalizacao para evitar
# duplicidade com os arquivos compartilhados em pipelines-store/nginx/Common.

# Cria variaveis relacionadas ao ASN/ISP.
geoip2 /usr/share/GeoIP/GeoLite2-ASN.mmdb {
    auto_reload 60m;
    $geoip2_data_asn_ip                  network;
    $geoip2_data_asn_system_number       autonomous_system_number;
    $geoip2_data_asn_system_organization autonomous_system_organization;
}

# Cria variaveis relacionadas ao pais de acesso.
geoip2 /usr/share/GeoIP/GeoLite2-Country.mmdb {
    auto_reload 60m;
    $geoip2_data_continent_code    default="SA" continent code;
    $geoip2_data_country_name      country;
    $geoip2_data_country_code      country code;
    $geoip2_data_country_iso_code  country iso_code;
    $geoip2_metadata_country_build metadata build_epoch;
}

# Cria variaveis relacionadas a cidade e coordenadas.
geoip2 /usr/share/GeoIP/GeoLite2-City.mmdb {
    auto_reload 60m;
    $geoip2_data_city_name   city names en;
    $geoip2_data_postal_code postal code;
    $geoip2_data_latitude    location latitude;
    $geoip2_data_longitude   location longitude;
    $geoip2_data_state_name  subdivisions 0 names en;
    $geoip2_data_state_code  subdivisions 0 iso_code;
}

# Bloqueio por codigo de pais (ISO 3166-1).
map $geoip2_data_country_iso_code $allowed_country {
    default yes;
    RU no;
    VE no;
}